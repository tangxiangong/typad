name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 3
  # Pin the stable Xcode 27.0 installation, not the image default or a beta.
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

jobs:
  rust:
    name: Rust tests and static checks
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Report selected Apple toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --find swiftc
          xcrun swiftc --version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --show-sdk-version
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust logic and documentation tests
        run: cargo test --workspace --locked
      - name: Native source and configuration checks
        run: bash ci/check-macos.sh

  gui:
    name: Universal app and native GUI tests
    needs: rust
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Report selected Apple toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --find swiftc
          xcrun swiftc --version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --show-sdk-version
      - name: Install Rust and Apple targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Build Universal app and run XCUITest
        run: bash ci/test-gui.sh
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: |
            target/ci-results/*.xcresult
            target/ci-results/*.log
          if-no-files-found: warn
          retention-days: 14
