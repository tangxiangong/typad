name: TyPadEditorTests
options:
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '2'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  EditorTestHost:
    type: application
    platform: iOS
    sources:
      - ${TYPAD_TEST_ROOT}/ipad/EditorTests/Host.swift
      - ${TYPAD_TEST_ROOT}/ipad/Sources/TyPad/SourceEditor.swift
      - ${TYPAD_TEST_ROOT}/ipad/Sources/TyPad/TextChange.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tangxiangong.typad.editor-test-host
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  EditorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ${TYPAD_TEST_ROOT}/ipad/EditorTests/EditorTests.swift
    dependencies:
      - target: EditorTestHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tangxiangong.typad.editor-tests
schemes:
  EditorTests:
    build:
      targets:
        EditorTestHost: all
        EditorTests: [test]
    test:
      targets:
        - EditorTests
