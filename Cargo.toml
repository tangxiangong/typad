tinymist-analysis = { git = "https://github.com/Myriad-Dreamin/tinymist.git", rev = "45b50f0d928e825248fa1c2fcbcd68549e957b5d" }
tinymist-std = { git = "https://github.com/Myriad-Dreamin/tinymist.git", rev = "45b50f0d928e825248fa1c2fcbcd68549e957b5d" }
tinymist-vfs = { git = "https://github.com/Myriad-Dreamin/tinymist.git", rev = "45b50f0d928e825248fa1c2fcbcd68549e957b5d" }
tinymist-world = { git = "https://github.com/Myriad-Dreamin/tinymist.git", rev = "45b50f0d928e825248fa1c2fcbcd68549e957b5d" }
tinymist-project = { git = "https://github.com/Myriad-Dreamin/tinymist.git", rev = "45b50f0d928e825248fa1c2fcbcd68549e957b5d" }
